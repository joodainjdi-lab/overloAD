<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>overload 90동 입면 지도</title>
<link rel="stylesheet" href="css/map.css">
</head>
<body>
<div id="stage"><div id="art">
  <div class="head"><div class="t">간판개선사업 9구역 90동</div></div>
  <p class="guide"><button class="howbtn" id="howBtn" type="button"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="6.6"/><path d="M8 7.2v4M8 4.9v.2" stroke-linecap="round"/></svg>보는 방법</button><span>칸 = 건물 1동</span></p>
  <div class="mguide" id="mguide" role="dialog" aria-modal="true" aria-label="한눈에 비교 보는 방법" hidden>
    <div class="mg-dim"></div><div class="mg-marks" id="mgMarks"></div>
    <div class="mg-foot"><button type="button" class="mg-skip" id="mgSkip">건너뛰기</button><span class="mg-cnt" id="mgCnt"></span><button type="button" class="mg-ok" id="mgOk">다음</button></div>
  </div>

  <div class="filter" id="filter">
    <button class="filter-btn" id="filterBtn" aria-haspopup="true" aria-expanded="false">
      <span class="lab"><b>보는 기준</b><span id="filterLab">가게당 광고물</span></span>
      <svg width="18" height="18" viewBox="0 0 14 14" fill="none" stroke-width="1.5"><path d="M3.5 5.5L7 9l3.5-3.5"/></svg>
    </button>
    <div class="menu" role="menu" id="menu"></div>
  </div>

  <div class="axb" aria-hidden="true">B = Building</div>
  <div class="cols" id="cols"></div>
  <div class="rows" id="rows"></div>
  <div class="vline"></div>
  <div class="grid" id="grid"></div>
  <div class="tip" id="tip"></div>

  <div class="legend" id="legend">
    <div class="ends"><span id="legL"></span><span id="legR"></span></div>
    <div class="bar"></div>
  </div>

  <div class="divider"></div>

  <div class="panel" id="panel">
    <div class="photo" id="photo" style="--p:50%" role="slider" aria-label="개선 전·현재 비교" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" tabindex="0">
      <div class="frame">
        <img class="after" id="imgA" alt="">
        <img class="before" id="imgB" alt="">
      </div>
      <div class="tag l"><b>BEFORE</b></div>
      <div class="tag r"><b>NOW</b></div>
      <div class="lo" id="lo" hidden>임시 저해상도 사진</div>
      <div class="knob"></div>
    </div>
    <div class="hint"><span>사진 위 스크롤·드래그로 개선 전 ↔ 현재</span><span class="pct" id="pct">50 : 50</span></div>
    <div class="who" id="who"></div>
    <div class="sum" id="sum"></div>
    <div class="stats" id="stats"></div>
    <div class="bars" id="bars"></div>
    <div class="notes" id="notes"></div>
    <div class="rank" id="rank"></div>
  </div>

  <!-- 필터별 TOP 5 (드롭다운) -->
  <div class="top5" id="top5">
    <div class="t5-sum" id="t5Sum"></div>
    <button class="t5-hd" id="t5Hd" aria-expanded="false" aria-controls="t5List"><span id="t5T">TOP 5</span><svg width="16" height="16" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.5 5.5L7 9l3.5-3.5"/></svg></button>
    <div class="t5-list" id="t5List"></div>
    <div class="t5-foot">누르면 그 건물의 자세한 정보가 열려요</div>
  </div>
</div></div>
<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/sound.js"></script>
</body>
</html>
